aid: mercanto
name: Mercanto
description: 'Mercanto (mercanto.mx) is a Mexican B2B wholesale marketplace that supplies
  restaurants, cafeterias, and food-service businesses with ingredients, groceries,
  cleaning supplies, and packaging bought at wholesale from vetted suppliers, with
  negotiated pricing and next-day delivery. Buyers order across categories including
  produce, groceries and pantry, dairy and eggs, proteins and cold cuts, bakery and
  desserts, beverages, frozen foods, and non-food items, while Mercanto handles supplier
  selection, negotiation, and fulfillment. The company is backed by Bain Capital Ventures.
  Its customer-facing storefront runs on a private backend (api.mercanto.mx) that is
  not publicly documented for third-party developers, so there is no public API product,
  developer portal, or SDK surface at this time.'
